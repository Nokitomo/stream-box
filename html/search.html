<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StreamBox - Ricerca</title>
  <meta name="description" content="Ricerca titoli nel catalogo StreamBox.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="page-header">
      <div class="container header-inner">
        <a class="brand" href="../index.html">STREAMBOX</a>
        <div class="header-tools">
          <a data-tv-focus="1" class="btn btn-sm" href="../index.html">Home</a>
        </div>
      </div>
    </header>

    <main class="container main-content stack">
      <form id="searchForm" class="search-bar" novalidate>
        <label class="sr-only" for="searchPageInput">Cerca titolo</label>
        <input data-tv-focus="1" id="searchPageInput" class="input" type="search" placeholder="Cerca titolo, descrizione, cast...">
        <button data-tv-focus="1" class="btn btn-primary" type="submit">Cerca</button>
      </form>

      <p id="searchStatus" class="badge" aria-live="polite">Scrivi una ricerca per iniziare.</p>
      <section id="searchResults" class="search-results" aria-live="polite"></section>
    </main>
  </div>

  <div id="titleModal" class="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Dettagli titolo">
    <div id="titleModalMask" class="modal-mask"></div>
    <div class="modal-body">
      <div id="titleModalContent" class="modal-content"></div>
    </div>
  </div>

  <script src="../js/compat/polyfills.js"></script>
  <script src="../js/core/utils.js"></script>
  <script src="../js/state/storage.js"></script>
  <script src="../js/state/url-state.js"></script>
  <script src="../js/data/catalog-loader.js"></script>
  <script src="../js/state/category-taxonomy.js"></script>
  <script src="../js/state/home-sections.js"></script>
  <script src="../js/state/catalog-engine.js"></script>
  <script src="../js/state/store.js"></script>
  <script src="../js/ui/templates.js"></script>
  <script src="../js/ui/modal.js"></script>
  <script src="../js/ui/tv-nav.js"></script>
  <script src="../js/pages/search-page.js"></script>
  <script src="../js/pages/search-bootstrap.js"></script>
</body>
</html>
