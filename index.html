<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>StreamBox Catalog</title>
  <meta name="description" content="Catalogo streaming personale basato su StreamingUnity e AnimeUnity.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app-shell">
    <header class="page-header">
      <div class="container header-inner">
        <a class="brand" href="index.html">STREAMBOX</a>
        <div class="header-tools">
          <a data-tv-focus="1" class="btn btn-sm" href="html/title.html">Title page</a>
          <a data-tv-focus="1" class="btn btn-sm" href="html/player.html">Player page</a>
        </div>
      </div>
    </header>

    <main class="container main-content">
      <form id="filtersForm" class="filters" novalidate>
        <label class="sr-only" for="searchInput">Cerca titolo</label>
        <input data-tv-focus="1" id="searchInput" class="input" type="search" placeholder="Cerca titolo, descrizione, cast...">
        <select data-tv-focus="1" id="providerFilter" class="select"></select>
        <select data-tv-focus="1" id="typeFilter" class="select"></select>
        <select data-tv-focus="1" id="genreFilter" class="select"></select>
        <select data-tv-focus="1" id="yearFilter" class="select"></select>
        <select data-tv-focus="1" id="sortFilter" class="select"></select>
        <button data-tv-focus="1" id="saveFilters" class="btn" type="button">Salva filtro</button>
        <button data-tv-focus="1" id="resetFilters" class="btn btn-ghost" type="button">Reset</button>
      </form>

      <p id="homeStatus" class="badge">Caricamento...</p>

      <section id="heroMount" class="hero" aria-live="polite"></section>

      <section class="rails" id="railsMount" aria-live="polite"></section>
      <p><button id="loadMoreRows" class="btn hidden" type="button" aria-hidden="true">Carica altri risultati</button></p>
    </main>
  </div>

  <div id="titleModal" class="modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Dettagli titolo">
    <div id="titleModalMask" class="modal-mask"></div>
    <div class="modal-body">
      <div id="titleModalContent" class="modal-content"></div>
    </div>
  </div>

  <script src="js/compat/polyfills.js"></script>
  <script src="js/core/utils.js"></script>
  <script src="js/state/storage.js"></script>
  <script src="js/state/url-state.js"></script>
  <script src="js/data/catalog-loader.js"></script>
  <script src="js/state/store.js"></script>
  <script src="js/ui/templates.js"></script>
  <script src="js/ui/tv-nav.js"></script>
  <script src="js/ui/modal.js"></script>
  <script src="js/ui/home-page.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
