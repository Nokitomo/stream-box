<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player - Netflix Clone</title>
  <meta name="description" content="Player statico simulato per il media center Netflix-like." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/11-player-page.css" />
</head>
<body class="player-page">
  <main class="player-main">
    <div class="player-stage" id="playerStage">
      <div class="player-stage-bg" id="playerBackdrop"></div>
      <div class="player-overlay"></div>

      <div class="player-topbar">
        <a class="player-back" id="playerBackToTitle" href="title.html">← Scheda titolo</a>
        <a class="player-home" href="index.html">Home</a>
      </div>

      <div class="player-center">
        <h1 id="playerTitle">Titolo</h1>
        <p id="playerMeta">Playback simulato</p>
      </div>

      <div class="player-controls">
        <button class="player-btn" id="playerToggle" type="button">Pausa</button>
        <div class="player-progress-wrap" aria-label="Avanzamento visione">
          <div class="player-progress-bar">
            <span id="playerProgressFill"></span>
          </div>
          <p id="playerProgressLabel">0%</p>
        </div>
      </div>
    </div>
  </main>

  <script defer src="js/data/series.js"></script>
  <script defer src="js/data/movies.js"></script>
  <script defer src="js/data/catalog.js"></script>
  <script defer src="js/data/provider-catalog.js"></script>
  <script defer src="js/state/storage.js"></script>
  <script defer src="js/pages/player-page.js"></script>
</body>
</html>
