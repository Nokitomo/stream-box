name: Scrape StreamingUnity Catalog

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Optional limit for archive pages (testing)"
        required: false
        type: string
      max_items:
        description: "Optional limit for items (testing)"
        required: false
        type: string
      detail_concurrency:
        description: "Optional detail concurrency override"
        required: false
        type: string
      shard_size:
        description: "Optional shard size override"
        required: false
        type: string
      include_raw:
        description: "Include raw provider payload (true/false)"
        required: false
        type: string
      min_year:
        description: "Minimum archive year for segmented crawl"
        required: false
        type: string
  schedule:
    - cron: "15 3 * * 1"

permissions:
  contents: write

concurrency:
  group: scrape-streamingunity-catalog
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Force DNS to Cloudflare
        run: |
          echo "nameserver 1.1.1.1" | sudo tee /etc/resolv.conf > /dev/null
          echo "nameserver 1.0.0.1" | sudo tee -a /etc/resolv.conf > /dev/null

      - name: Run StreamingUnity Scraper
        env:
          MAX_PAGES: ${{ github.event.inputs.max_pages }}
          MAX_ITEMS: ${{ github.event.inputs.max_items }}
          DETAIL_CONCURRENCY: ${{ github.event.inputs.detail_concurrency }}
          SHARD_SIZE: ${{ github.event.inputs.shard_size }}
          INCLUDE_RAW: ${{ github.event.inputs.include_raw }}
          MIN_YEAR: ${{ github.event.inputs.min_year }}
        run: |
          ARGS=(--out-dir data/providers/streamingunity --dns 1.1.1.1,1.0.0.1)
          if [ -n "${MAX_PAGES}" ]; then ARGS+=(--max-pages "${MAX_PAGES}"); fi
          if [ -n "${MAX_ITEMS}" ]; then ARGS+=(--max-items "${MAX_ITEMS}"); fi
          if [ -n "${DETAIL_CONCURRENCY}" ]; then ARGS+=(--detail-concurrency "${DETAIL_CONCURRENCY}"); fi
          if [ -n "${SHARD_SIZE}" ]; then ARGS+=(--shard-size "${SHARD_SIZE}"); fi
          if [ -n "${INCLUDE_RAW}" ]; then ARGS+=(--include-raw "${INCLUDE_RAW}"); fi
          if [ -n "${MIN_YEAR}" ]; then ARGS+=(--min-year "${MIN_YEAR}"); fi
          node scripts/scrapers/streamingunity-catalog.mjs "${ARGS[@]}"

      - name: Build App Catalog
        run: |
          npm run catalog:build-app

      - name: Validate JSON
        run: |
          node -e "const fs=require('fs'); const path=require('path'); const providerIndex='data/providers/streamingunity/index.json'; const index=JSON.parse(fs.readFileSync(providerIndex,'utf8')); if(!Array.isArray(index.chunks)||index.chunks.length===0){throw new Error('streamingunity chunks missing');} const chunk=JSON.parse(fs.readFileSync(path.join('data/providers/streamingunity',index.chunks[0].file),'utf8')); if(!Array.isArray(chunk.items)){throw new Error('streamingunity chunk items missing');} const appIndex=JSON.parse(fs.readFileSync('data/app/catalog-index.json','utf8')); if(!Array.isArray(appIndex.items)){throw new Error('app catalog index invalid');} console.log('streamingunity items:', index.count, 'app items:', appIndex.totalItems);"

      - name: Build Static Site
        run: |
          npm run lint
          npm run test
          npm run build

      - name: Commit and Push Updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/providers/streamingunity data/app
          if git diff --staged --quiet; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git commit -m "chore(data): update streamingunity catalog and app index"
          git push
